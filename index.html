<!DOCTYPE html>
<html>
<head>
    <title>Luffy's Banquet</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0c141c;
            margin: 0;
            padding: 0;
            display: grid;
            /* Divides screen: Left Ad (160px), Game (fills middle), Right Ad (160px) */
            grid-template-columns: 160px 1fr 160px;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        canvas {
            outline: none;
            max-width: 100%;
            max-height: 95vh;
            /* Centers the game inside the middle column */
            justify-self: center;
            object-fit: contain;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }
        /* Style for the ad placeholder slots */
        .ad-banner {
            width: 160px;
            height: 600px;
            background-color: #1a2430; /* Dark box so you can see where it sits */
            display: flex;
            justify-content: center;
            align-items: center;
            color: #4a5a70;
            font-family: sans-serif;
            font-size: 14px;
            border: 2px dashed #3a4a60;
        }
    </style>
    <script src="processing.min.js"></script>
</head>
<body>

    <!-- Left Ad Container -->
    <div id="left-ad" class="ad-banner">
        AD BANNER LEFT (160x600)
    </div>

    <!-- The Game Canvas (Stays perfectly in the middle) -->
    <canvas data-processing-sources="Luffy.pde" context="2d" willReadFrequently="true" tabindex="0"></canvas>

    <!-- Right Ad Container -->
    <div id="right-ad" class="ad-banner">
        AD BANNER RIGHT (160x600)
    </div>

</body>
</html>
