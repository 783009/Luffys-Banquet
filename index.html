<!DOCTYPE html>
<html>
<head>
    <title>Luffy's Banquet</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0c141c;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        canvas {
            outline: none;
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 800 / 600; 
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
    </style>
    <script src="processing.min.js"></script>
</head>
<body>

    <!-- Added context optimizations directly into the translation element -->
    <canvas data-processing-sources="Luffy.pde" context="2d" willReadFrequently="true"></canvas>

</body>
</html>
