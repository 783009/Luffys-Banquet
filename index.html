<!DOCTYPE html>
<html>
<head>
    <title>Luffy's Banquet</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0c141c;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        canvas {
            outline: none;
            /* Forces the canvas to dynamically expand as big as your monitor allows */
            width: 95vw;
            height: 95vh;
            
            /* Locks the proportions so Luffy doesn't look fat or distorted */
            object-fit: contain;
            
            /* Stops the browser from blurring your sprites when it blows them up */
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }

    </style>
    <script src="processing.min.js"></script>
</head>
<body>

    <!-- Added context optimizations directly into the translation element -->
    <canvas data-processing-sources="Luffy.pde" context="2d" willReadFrequently="true"></canvas>

</body>
</html>
