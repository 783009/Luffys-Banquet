<!DOCTYPE html>
<html>
<head>
    <title>Luffy's Banquet</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0c141c;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        canvas {
            outline: none;
            /* Restores your perfect full-scale layout */
            width: auto;
            height: 95vh;
            max-width: 95vw;
            
            /* Locks the 4:3 proportions so Luffy never looks fat or distorted */
            object-fit: contain;
            
            /* Clean retro border to frame the game viewport */
            border: 4px solid #1a2430;
            border-radius: 8px;
            box-shadow: 0px 8px 24px rgba(0, 0, 0, 0.5);
            
            /* High-fidelity retro pixel rendering rules */
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }
    </style>
    <script src="processing.min.js"></script>
</head>
<body>

    <!-- The Game Canvas (Back to its normal full size with a nice border) -->
    <canvas data-processing-sources="Luffy.pde" ></canvas>

</body>
</html>
